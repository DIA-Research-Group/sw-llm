input {
  tcp {
    port => 5044
  }
}

filter {
  # 1. Mantém a sua marcação de ambiente
  mutate {
    add_field => { "ambiente" => "live_fire_lab" }
  }

  # 2. O BISTURI: Pega qualquer coisa que comece com { e termine com }
  grok {
    match => { "message" => "(?<json_extraido>\{.*\})" }
  }

  # 3. O TRADUTOR: Transforma o texto extraído em campos estruturados
  if [json_extraido] {
    json {
      source => "json_extraido"
      
      # 4. A VASSOURA: Limpa o lixo e a mensagem original bruta
      remove_field => ["message", "json_extraido", "event", "@version"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    # Mantivemos o nome original da sua "gaveta"
    index => "telemetria-alvo-%{+YYYY.MM.dd}"
  }
  
  # Saída no console do Logstash para debug rápido se necessário
  stdout { codec => rubydebug }
}
