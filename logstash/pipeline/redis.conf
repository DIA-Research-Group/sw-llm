input {
  tcp {
    port => 5044
    type => syslog
  }
}

filter {
  if [type] == "syslog" {
    # Isola o JSON da mensagem do Syslog
    grok {
      match => { "message" => "%{SYSLOG5424PRI}%{SYSLOGTIMESTAMP} %{DATA:container_name}\[%{INT}\]: %{GREEDYDATA:json_payload}" }
    }

    # Transforma a string JSON em campos
    json {
      source => "json_payload"
      target => "nginx"
    }

    # Limpeza e Tipagem (Isolation Forest)
    mutate {
      convert => {
        "[nginx][request_time]" => "float"
        "[nginx][status]" => "integer"
      }
      add_field => { "ambiente" => "live_fire_lab" }
      # Remove campos brutos para economizar espaço
      remove_field => ["message", "json_payload", "event"]
    }
  }
}

# #21: buffer em RAM. O detector consome a lista com LPOP; o Elasticsearch
# nao e iniciado nesta variante (economia de CPU/RAM medida no experimento).
output {
  if [nginx] {
    redis {
      host => "redis"
      port => 6379
      data_type => "list"
      key => "ips:logs"
      codec => json
    }
  }
}
