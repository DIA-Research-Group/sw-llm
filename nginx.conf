events { worker_connections 1024; }

http {
    log_format json_analytics escape=json '{'
        '"timestamp": "$time_iso8601", '
        '"remote_addr": "$remote_addr", '
        '"request_method": "$request_method", '
        '"request_uri": "$request_uri", '
        '"status": "$status", '
        '"request_time": "$request_time", '
        '"body_bytes_sent": "$body_bytes_sent", '
        '"http_referrer": "$http_referer", '
        '"http_user_agent": "$http_user_agent", '
        '"request": "$request", '
        '"host": "$host", '
        '"request_length": "$request_length"'
    '}';

    # Os tres ultimos campos (linha crua da requisicao, Host e tamanho) so sao
    # vistos pelo detector com rich_log: true. $request continua preenchido
    # quando o Nginx rejeita a URI (ex.: traversal da CVE-2021-41773 -> 400),
    # caso em que $request_uri fica vazio.
    access_log /var/log/nginx/access.log json_analytics;

    # DNS interno do Docker: permite que os alvos opcionais (VulHub) nao
    # precisem existir quando o Nginx sobe.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Importa a lista dinamica de IPs bloqueados (vale para todos os alvos)
    include /etc/nginx/blocklist.conf;

    # Alvo principal: OWASP Juice Shop
    server {
        listen 80 default_server;

        location / {
            # Backend selecionado pelo runner (Juice Shop direto ou via WAF CRS, #19)
            include /etc/nginx/backend.conf;
            proxy_pass $app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # #22 VulHub: sistema composto por varios servicos vulneraveis atras do
    # mesmo proxy, roteados pelo cabecalho Host (a URI e repassada sem
    # normalizacao, preservando os payloads).
    server {
        listen 80;
        server_name solr.lab;
        location / {
            set $up_solr http://vh-solr:8983;
            proxy_pass $up_solr;
            proxy_set_header Host $host;
        }
    }
    server {
        listen 80;
        server_name cgi.lab;
        location / {
            set $up_cgi http://vh-bash:80;
            proxy_pass $up_cgi;
            proxy_set_header Host $host;
        }
    }
    server {
        listen 80;
        server_name httpd.lab;
        location / {
            set $up_httpd http://vh-httpd:80;
            proxy_pass $up_httpd;
            proxy_set_header Host $host;
        }
    }
}
